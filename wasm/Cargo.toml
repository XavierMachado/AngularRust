[package]
name = "wt-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# What wasm-pack builds for the browser. This crate is deliberately thin: the
# logic lives in wt-shared, and everything here is boundary — Rust types in,
# JavaScript types out.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wt-shared = { path = "../shared" }
wasm-bindgen = "0.2"
serde_json = { workspace = true }
