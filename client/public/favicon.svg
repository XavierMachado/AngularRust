<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WebTransport console">
  <!-- The ledger motif: one connection, a reliable tick up, a datagram tick down. -->
  <rect width="32" height="32" rx="7" fill="#0e1a2b" />
  <line x1="4" y1="16" x2="28" y2="16" stroke="#4d5e75" stroke-width="1.5" />
  <line x1="10" y1="16" x2="10" y2="7" stroke="#3fb2bd" stroke-width="3" stroke-linecap="round" />
  <line x1="16" y1="16" x2="16" y2="25" stroke="#ff4d9d" stroke-width="3" stroke-linecap="round" />
  <line x1="22" y1="16" x2="22" y2="10" stroke="#3fb2bd" stroke-width="3" stroke-linecap="round" />
</svg>
