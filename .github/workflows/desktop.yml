# Builds the desktop apps: each console (Lit and Angular) as a self-contained
# executable for Windows and Linux, with the wt-server embedded. Windows
# executables have to be built on Windows — Tauri's cross-compilation is
# experimental — which is why this runs as a matrix instead of one job.
#
# Run it from the Actions tab (workflow_dispatch), or push a v* tag.
# Artifacts land on the workflow run page: an NSIS installer per variant on
# Windows, a .deb and an .AppImage per variant on Linux.

name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        variant: [lit, angular]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build the Lit console
        if: matrix.variant == 'lit'
        run: npm ci && npm run build
        working-directory: client-lit

      - name: Build the Angular console
        if: matrix.variant == 'angular'
        run: npm ci && npm run build
        working-directory: client

      - name: Build the desktop bundles
        run: >
          npx --yes @tauri-apps/cli@latest build
          --bundles ${{ runner.os == 'Linux' && 'deb appimage' || 'nsis' }}
          ${{ matrix.variant == 'angular' && '--config tauri.angular.conf.json' || '' }}
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.variant }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/nsis/*.exe
